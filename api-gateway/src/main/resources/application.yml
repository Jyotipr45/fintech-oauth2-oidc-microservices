# Every environment-specific value or secret is an ${ENV_VAR} placeholder (see infra/.env.example).
server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      default-filters:
        # Downstream services never set CORS headers; dedupe guards against accidental duplicates.
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # Bearer-token API: cookies are never forwarded to internal services.
        - RemoveRequestHeader=Cookie
        # Reject oversized bodies at the edge (payload-based DoS).
        - name: RequestSize
          args:
            maxSize: 1MB
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@subjectKeyResolver}"
            deny-empty-key: true
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:10}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:20}
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URI}
          predicates:
            - Path=/api/v1/accounts,/api/v1/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountServiceCircuitBreaker
                fallbackUri: forward:/fallback/account-service
                # 503 is not listed: services use it for meaningful, retryable answers
                # (e.g. "transfer pending"); timeouts and connection errors always trip the breaker.
                statusCodes:
                  - 502
                  - 504
            # Retries only idempotent GETs; never replays a money movement.
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1s
                  factor: 2
                  basedOnPreviousValue: false
        - id: transfer-service
          uri: ${TRANSFER_SERVICE_URI}
          predicates:
            - Path=/api/v1/transfers,/api/v1/transfers/**
          filters:
            - name: CircuitBreaker
              args:
                name: transferServiceCircuitBreaker
                fallbackUri: forward:/fallback/transfer-service
                # 503 is not listed: services use it for meaningful, retryable answers
                # (e.g. "transfer pending"); timeouts and connection errors always trip the breaker.
                statusCodes:
                  - 502
                  - 504
            # Retries only idempotent GETs; never replays a money movement.
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1s
                  factor: 2
                  basedOnPreviousValue: false
        # Note: /internal/** service-to-service endpoints are intentionally NOT routed.

banking:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    # The gateway accepts any token minted for the banking API; services narrow this to their own audience.
    audiences: banking-api
    clock-skew: 30s
    jwks-cache-ttl: 5m

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    max-age: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    banking.access: INFO
